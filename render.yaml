services:
  - type: web
    name: lets-eat
    runtime: node
    region: virginia
    plan: 1c-2g
    branch: fix/self-reflect-render
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:host
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_PATH
        value: /var/data/lets-eat.sqlite
      - key: APP_ORIGIN
        value: https://lets-eat-ba8e.onrender.com
    disk:
      name: lets-eat-data
      mountPath: /var/data
      sizeGB: 1
